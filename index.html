<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wörterdetektiv – Nomen, Verben &amp; Adjektive erkennen</title>
<meta name="description" content="Wörterdetektiv: Ein Lernspiel der Reihe Förderfreude Games. Kinder lösen Wörterfälle und erkennen Nomen, Verben und Adjektive.">
<meta name="theme-color" content="#2f5d62">
<style>
:root{
  --cream:#f7eed8; --paper:#fffaf0; --wall:#e4ead3; --sage:#a9bfa6; --sage-l:#dbe6d6; --sage-d:#4f6f52;
  --petrol:#2f5d62; --petrol-l:#d6e6e4; --terra:#a94a33; --terra-l:#e49a82; --rose:#e9c2c0; --must:#e2ac3a; --must-l:#f6e4b8;
  --brown:#6b4a33; --brown-l:#c99a68; --ink:#3a2b20; --cork:#d9b27a; --line:#c9b88f;
  --f-body:"Verdana","Trebuchet MS","Segoe UI",Tahoma,system-ui,sans-serif; --f-head:Georgia,"Times New Roman",serif; --f-type:"Courier New",Courier,monospace;
  --ring:0 0 0 3px #fff,0 0 0 7px var(--petrol);
}
*{box-sizing:border-box}
html{font-size:clamp(14px,calc(.9vmin + 8.5px),30px);-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background-color:var(--wall);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
button:focus{outline:none}
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring)}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.5rem 1rem;z-index:99}.skip:focus{left:.5rem;top:.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background-color:var(--wall);background-image:repeating-linear-gradient(90deg,rgba(79,111,82,.07) 0 1.6rem,transparent 1.6rem 3.2rem)}
.pic{width:100%;height:100%}

/* ---------- Werkzeuge (Ton, Hilfe) ---------- */
.tools{display:flex;gap:.5rem;align-items:center}
.tbtn{width:3rem;height:3rem;min-width:44px;min-height:44px;border-radius:50%;border:3px solid var(--brown);background:var(--paper);color:var(--petrol);display:grid;place-items:center;padding:0;box-shadow:0 2px 0 rgba(58,43,32,.35)}
.tbtn svg{width:62%;height:62%}
.tbtn:active{transform:translateY(1px)}
.tbtn[aria-pressed="false"] .wave{display:none}.tbtn[aria-pressed="true"] .slash{display:none}
.tbtn.help{background:var(--must-l)}
.spk{width:3.2rem;height:3.2rem;min-width:44px;min-height:44px;border-radius:50%;border:3px solid var(--brown);background:var(--paper);color:var(--petrol);display:grid;place-items:center;padding:0;flex:none}
.spk svg{width:60%;height:60%}.spk .slash{display:none}.spk .wave{display:block}

/* ---------- Startseite: Detektivzentrale ---------- */
#screen-start{overflow:hidden}
.hq-top{position:relative;flex:none;height:clamp(92px,27vh,340px);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;justify-items:center;padding:0 .5rem;overflow:hidden;border-bottom:4px solid var(--brown);background:linear-gradient(#e9efd9,#dbe5cb)}
.hq-top .deco{height:100%;width:100%;min-width:0;grid-row:1}
.hq-top .deco.l{grid-column:1}.hq-top .deco.r{grid-column:3}.hq-top .plaque{grid-column:2;grid-row:1}
.hq-tools{position:absolute;top:.5rem;right:.6rem;z-index:3}
.plaque{position:relative;z-index:2;text-align:center;background:var(--paper);border:4px solid var(--brown);border-radius:14px;padding:.55rem 1.6rem .6rem;box-shadow:0 0 0 4px var(--must) inset,0 6px 0 rgba(58,43,32,.3);max-width:92%}
.plaque:before,.plaque:after{content:"";position:absolute;top:-1.1rem;width:3px;height:1.1rem;background:var(--brown)}.plaque:before{left:22%}.plaque:after{right:22%}
.plaque h1{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(1.5rem,6.2vmin + .3vw,4.2rem);letter-spacing:.07em;color:var(--petrol);line-height:1.05}
.plaque h1 .hat{display:inline-block;width:.9em;height:.62em;vertical-align:.02em;margin-right:.2em}
.plaque p{margin:.25rem 0 0;font-family:var(--f-type);font-weight:700;font-size:clamp(.78rem,1.8vmin + .15vw,1.35rem);color:var(--terra);letter-spacing:.02em}
.cases{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:.55rem .9rem .3rem}
.cases h2{margin:0 0 .45rem;font-family:var(--f-type);font-size:clamp(.95rem,1.9vmin + .2vw,1.6rem);color:var(--petrol);letter-spacing:.04em;flex:none}
.cases h2 span{display:inline-block;background:var(--must);color:var(--ink);border-radius:50%;width:1.5em;height:1.5em;text-align:center;line-height:1.5em;margin-right:.4em;font-weight:700}
.folders{flex:1;min-height:0;width:100%;max-width:min(1500px,100%);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));column-gap:clamp(.6rem,1.8vmin,1.5rem);row-gap:clamp(1.6rem,3.4vmin,2.6rem);padding-top:1.45rem}
.folder{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;text-align:center;padding:1.2rem .6rem .5rem;min-height:0;border:3px solid var(--brown);border-radius:6px 14px 10px 10px;background:linear-gradient(#ecce94,#e2bd78);box-shadow:0 5px 0 rgba(58,43,32,.35);transition:transform .15s}
.folder:before{content:attr(data-fall);position:absolute;left:-3px;top:-1.35rem;height:1.45rem;padding:0 .8rem;background:#e7c488;border:3px solid var(--brown);border-bottom:none;border-radius:10px 10px 0 0;font-family:var(--f-type);font-weight:700;font-size:.78rem;line-height:1.3rem;color:var(--ink);white-space:nowrap}
.folder:hover{transform:translateY(-3px)}.folder:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(58,43,32,.35)}
.folder .ico{width:clamp(34px,min(11vmin,10.5vh),150px);aspect-ratio:12/10;flex:none}
.folder .lbl{background:var(--paper);border:2px solid var(--line);border-radius:3px;padding:.25rem .5rem .3rem;max-width:100%;transform:rotate(-1deg)}
.folder:nth-child(even) .lbl{transform:rotate(.8deg)}
.folder .pl{display:block;font-family:var(--f-type);font-size:.78rem;font-weight:700;color:var(--terra);letter-spacing:.03em}
.folder .ti{display:block;font-weight:700;font-size:clamp(.88rem,1.5vmin + .35vw,1.5rem);line-height:1.18;color:var(--ink)}
.hq-desk{flex:none;position:relative;height:clamp(40px,10vh,110px);overflow:hidden;border-top:4px solid var(--brown);background:var(--brown-l)}
.hq-desk .deco{position:absolute;bottom:0;height:100%;width:auto;max-width:50%}
.hq-desk .deco.l{left:0}.hq-desk .deco.r{right:0}
.credit{position:absolute;left:0;right:0;bottom:.15rem;text-align:center;font-size:.7rem;color:var(--ink);opacity:.8;z-index:2;font-family:var(--f-type)}

/* ---------- Dialoge ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(58,43,32,.62);display:grid;place-items:center;padding:.8rem}
.sheet{background:var(--paper);border:4px solid var(--brown);border-radius:12px;box-shadow:0 8px 0 rgba(58,43,32,.4);width:min(44rem,100%);max-height:100%;overflow:auto;padding:1rem 1.1rem 1.1rem;position:relative}
.sheet:before{content:"";position:absolute;left:1.2rem;top:-.9rem;width:5.5rem;height:1.6rem;background:var(--cork);border:3px solid var(--brown);border-radius:6px 6px 0 0}
.sheet h2{margin:.2rem 0 .3rem;font-family:var(--f-head);color:var(--petrol);font-size:1.45rem}
.sheet .sub{margin:0 0 .8rem;font-size:1rem}
.lvl-head{display:flex;gap:.7rem;align-items:center;margin-bottom:.4rem}
.lvl-head .ico{width:4.2rem;aspect-ratio:12/10;flex:none}
.lvl-head h2{margin:0;font-size:1.25rem;line-height:1.15}.lvl-head .pl{font-family:var(--f-type);font-weight:700;color:var(--terra);font-size:.85rem}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.lvl{border:3px solid var(--brown);border-radius:10px;background:var(--cream);padding:.6rem .4rem;min-height:5.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;box-shadow:0 4px 0 rgba(58,43,32,.35)}
.lvl:hover{background:var(--must-l)}.lvl:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,43,32,.35)}
.lvl b{font-size:1.15rem;letter-spacing:.03em}.lvl small{font-size:.82rem;line-height:1.2;text-align:center}
.lvl .stars{display:flex;gap:.2rem}.lvl .stars svg{width:1.1rem;height:1.1rem;color:var(--petrol)}
.lvl .stars svg.off{opacity:.28}
.btn{border:3px solid var(--brown);border-radius:12px;background:var(--cream);padding:.5rem 1.1rem;min-height:3rem;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 rgba(58,43,32,.35);display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,43,32,.35)}
.btn.pri{background:var(--terra);color:#fff;border-color:#6e2e1f}
.btn.pri:hover{background:#963f2a}
.btn svg{width:1.3rem;height:1.3rem}
.sheet .row{display:flex;justify-content:flex-end;margin-top:.8rem}
.help-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.hcard{border:3px solid var(--brown);border-radius:10px;padding:.6rem .7rem;background:var(--cream)}
.hcard h3{margin:0;font-family:var(--f-type);font-size:1.2rem;color:var(--petrol);letter-spacing:.04em}
.hcard .alt{font-size:.8rem;margin:0 0 .3rem;color:var(--brown)}
.hcard p{margin:.2rem 0;font-size:.95rem;line-height:1.35}
.hcard .exs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}.hcard .exs span{background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:.1rem .5rem;font-weight:700;font-size:.95rem}

/* ---------- Spielbildschirm ---------- */
#screen-game{background-color:var(--wall)}
.gbar{flex:none;display:flex;align-items:center;gap:.6rem;padding:.35rem .6rem;background:var(--petrol);color:var(--cream);border-bottom:4px solid var(--brown);min-height:3.5rem}
.gbar .back{border:3px solid var(--cream);border-radius:999px;background:transparent;color:var(--cream);padding:.2rem .85rem .2rem .55rem;min-height:44px;font-weight:700;display:flex;align-items:center;gap:.35rem;font-size:.95rem;flex:none}
.gbar .back svg{width:1.3rem;height:1.3rem}
.gbar .back:hover{background:rgba(255,250,240,.14)}
.gbar .back:focus-visible{box-shadow:0 0 0 3px var(--petrol),0 0 0 6px #fff}
.gbar .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;line-height:1.15}
.gbar .fall{font-family:var(--f-type);font-weight:700;font-size:.85rem;color:#f6dc9a;letter-spacing:.04em;white-space:nowrap}
.gbar .gt{font-family:var(--f-head);font-weight:700;font-size:1.2rem}
.gbar .lv{font-family:var(--f-type);font-weight:700;font-size:.8rem;background:var(--must);color:var(--ink);border-radius:999px;padding:.05rem .65rem;letter-spacing:.06em}
.gbar .tbtn{border-color:var(--cream)}
.gbar .cnt{font-family:var(--f-type);font-weight:700;font-size:.85rem;color:var(--cream);white-space:nowrap}
.nosound .spk{display:none}

/* Fallakte (Fortschritt) */
.fallakte{flex:none;display:flex;align-items:stretch;gap:.6rem;margin:.5rem .6rem 0;padding:.4rem .6rem .45rem;background:var(--cork);background-image:radial-gradient(rgba(107,74,51,.28) 1px,transparent 1.5px);background-size:9px 9px;border:4px solid var(--brown);border-radius:12px;box-shadow:0 4px 0 rgba(58,43,32,.3);position:relative;overflow-x:clip}
.fa-label{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.1rem;background:var(--paper);border:2px solid var(--brown);border-radius:4px;padding:.15rem .6rem;font-family:var(--f-type);text-align:center;transform:rotate(-1.5deg);align-self:center}
.fa-label b{font-size:.9rem;letter-spacing:.06em;color:var(--terra)}
.fa-label span{font-size:.78rem;font-weight:700;white-space:nowrap}
.fa-slots{flex:1;min-width:0;position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.4rem;padding:0 .2rem}
.fa-thread{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.fa-thread path{fill:none;stroke:var(--terra);stroke-width:2.6;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:0}
.fa-thread path.on{opacity:1}
.clue{position:relative;height:clamp(44px,9.4vh,92px);max-width:92px;width:100%;justify-self:center;background:var(--paper);border:2px solid var(--brown);border-radius:4px;padding:.3rem .15rem .12rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;box-shadow:0 2px 0 rgba(58,43,32,.3)}
.clue .pin{position:absolute;left:50%;top:-.3rem;width:.7rem;height:.7rem;margin-left:-.35rem;border-radius:50%;background:#7a8f93;border:2px solid var(--ink);z-index:4}
.clue svg{flex:1;min-height:0;width:100%}
.clue .num{font-family:var(--f-type);font-weight:700;font-size:.7rem;line-height:1}
.clue.locked{background:#efe3c4;border-style:dashed;border-color:#8d7455}
.clue.locked svg{filter:brightness(0);opacity:.2}
.clue.locked .pin{background:#c9bba0}
.clue.on .pin{background:var(--terra)}
.clue:nth-child(3n+1).on .pin{background:var(--terra)}.clue:nth-child(3n+2).on .pin{background:var(--petrol)}.clue:nth-child(3n).on .pin{background:var(--must)}
.clue.on:nth-child(odd){transform:rotate(-2deg)}.clue.on:nth-child(even){transform:rotate(2.2deg)}
.clue.pop{animation:pinpop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pinpop{0%{transform:translateY(-.5rem) scale(1.18) rotate(-8deg);opacity:0}60%{opacity:1}100%{}}
.fa-stamp{position:absolute;left:50%;top:50%;width:min(15rem,60%);transform:translate(-50%,-50%) rotate(-4deg);z-index:6;pointer-events:none;background:var(--paper);border-radius:10px;opacity:.97;animation:stampin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampin{0%{transform:translate(-50%,-50%) scale(2.2) rotate(-14deg);opacity:0}100%{}}

.stage-wrap{flex:1;min-height:0;display:flex;padding:.5rem .6rem .2rem}
#stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:stretch;background:var(--paper);border:4px solid var(--brown);border-radius:14px;box-shadow:0 5px 0 rgba(58,43,32,.3);padding:.7rem .9rem;position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 1.9rem,rgba(201,184,143,.35) 1.9rem calc(1.9rem + 1px))}
#stage:before,#stage:after{content:"";position:absolute;top:-.8rem;width:4.4rem;height:1.4rem;background:rgba(226,172,58,.78);border:2px solid rgba(107,74,51,.5);transform:rotate(-3deg)}
#stage:before{left:2rem}#stage:after{right:2rem;transform:rotate(2.5deg)}
.task{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(.4rem,1.6vh,1rem);width:100%;max-width:70rem;margin:0 auto}
.prompt{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(1.15rem,2.5vmin + .5vw,2.3rem);color:var(--petrol);text-align:center;line-height:1.2;flex:none}
.prompt .tag{display:inline-block;font-family:var(--f-type);background:var(--must);color:var(--ink);padding:0 .45em;border-radius:6px;border:2px solid var(--brown);letter-spacing:.04em}

.fbrow{flex:none;display:flex;align-items:center;gap:.7rem;padding:.2rem .6rem calc(.45rem + env(safe-area-inset-bottom));min-height:4.6rem}
#fb{flex:1;min-width:0;display:flex;align-items:center;gap:.6rem;border:3px solid transparent;border-radius:12px;padding:.35rem .7rem;min-height:3.7rem;font-size:1.02rem;line-height:1.3}
#fb .ficon{flex:none;width:2rem;height:2rem}
#fb .fh{display:block;font-weight:700;font-size:1.15rem;letter-spacing:.02em}
#fb.ok{background:var(--sage-l);border-color:var(--sage-d)}
#fb.hint{background:var(--must-l);border-color:#b98a28}
#fb.info{background:var(--petrol-l);border-color:var(--petrol)}
#btn-next{flex:none;min-width:8.5rem}

/* Antwortknöpfe: Farbe wechselt zufällig und hat nie mit der Wortart zu tun */
.sk0{background:#fffaf0}.sk1{background:#dbe6d6}.sk2{background:#f3d9d6}.sk3{background:#f6e4b8}.sk4{background:#d6e6e4}
.abtn{border:3px solid var(--brown);border-radius:12px;box-shadow:0 5px 0 rgba(58,43,32,.38);min-height:3.4rem;padding:.4rem .6rem;font-weight:700;font-size:clamp(1.05rem,2.6vmin + .3vw,2.2rem);letter-spacing:.04em;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.abtn:hover:not(:disabled){transform:translateY(-2px)}
.abtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(58,43,32,.38)}
.abtn:disabled{cursor:default}
.abtn.tried{background:#ece4d2;color:#5a4a3a;border-style:dashed;box-shadow:none;transform:none}
.abtn.tried:after{content:"?";position:absolute;right:.45rem;top:.2rem;font-family:var(--f-head);font-size:1.1em;color:var(--brown)}
.abtn.right{background:var(--sage-l);border-color:var(--sage-d);box-shadow:0 0 0 4px var(--sage-d)}
.abtn.right:before{content:"✓";font-size:1.1em;margin-right:.45rem;color:var(--sage-d)}
.abtn.dim{opacity:.55;box-shadow:none}

/* Modus 1 */
.t-which .wcard-big{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(.6rem,2vw,1.6rem);background:#fff;border:3px solid var(--brown);border-top:2.4rem solid #fff;border-radius:8px;box-shadow:0 6px 0 rgba(58,43,32,.3);padding:.9rem 1.5rem 1rem;min-width:min(30rem,100%);max-width:100%;background-image:repeating-linear-gradient(0deg,transparent 0 2.2rem,#cfe0e0 2.2rem calc(2.2rem + 2px))}
.t-which .wcard-big:before{content:"";position:absolute;left:0;right:0;top:-1.1rem;height:2px;background:var(--terra);opacity:.75}
.t-which .wcard-big .figure{width:clamp(5rem,16vmin,11rem);aspect-ratio:12/10;flex:none}
.t-which .word{font-weight:700;font-size:clamp(2.1rem,8.4vmin + .6vw,6rem);line-height:1.1;letter-spacing:.02em;word-break:break-word;text-align:center}
.t-which .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.5rem,1.6vw,1.2rem);width:100%;max-width:60rem}
.t-which .abtn{min-height:clamp(3.4rem,13vh,7rem)}

/* Modus 2: Aktenschrank */
.t-sort{justify-content:center}
.tray{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-content:flex-start;min-height:3.6rem;width:100%;flex:none}
.wc{border:3px solid var(--brown);border-radius:10px;background:var(--paper);box-shadow:0 4px 0 rgba(58,43,32,.35);min-height:3rem;min-width:44px;padding:.25rem .9rem;font-weight:700;font-size:clamp(1.05rem,2.5vmin + .3vw,2.1rem);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;align-items:center;gap:.35rem}
.wc:hover{background:var(--must-l)}
.wc.sel{background:var(--must);box-shadow:0 0 0 4px var(--ink),0 4px 0 rgba(58,43,32,.35)}
.wc.sel:before{content:"☛";font-size:1em}
.wc.drag-src{opacity:.35}
.wc.ghost{position:fixed;z-index:80;pointer-events:none;transform:rotate(-3deg) scale(1.06);box-shadow:0 10px 18px rgba(58,43,32,.45);margin:0}
.wc.in{cursor:default;background:#fff;box-shadow:none;border-width:2px;border-radius:6px;min-height:2.3rem;font-size:clamp(.95rem,2.1vmin + .25vw,1.8rem);padding:.1rem .6rem}
.wc.in:before{content:"✓";color:var(--sage-d);font-size:.9em}
.drawers{flex:1;min-height:0;max-height:22rem;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.5rem,1.6vw,1.2rem);align-items:stretch}
.drawer{display:flex;flex-direction:column;border:4px solid var(--brown);border-radius:10px;background:#b9cdb6;box-shadow:0 5px 0 rgba(58,43,32,.38);padding:.3rem .4rem .45rem;min-width:0;min-height:7.5rem;text-align:center;color:var(--ink)}
.drawer:hover:not(.done){background:#c9d9c5}
.drawer.over{background:var(--must-l);box-shadow:0 0 0 5px var(--must),0 5px 0 rgba(58,43,32,.38)}
.drawer .plate{margin:0 auto .4rem;background:var(--paper);border:2px solid var(--brown);border-radius:4px;padding:.1rem .8rem;font-family:var(--f-type);font-weight:700;font-size:clamp(.9rem,1.9vmin + .3vw,1.7rem);letter-spacing:.05em;position:relative}
.drawer .plate:before,.drawer .plate:after{content:"";position:absolute;top:50%;width:.5rem;height:.5rem;margin-top:-.25rem;border-radius:50%;background:var(--brown);}
.drawer .plate:before{left:.18rem}.drawer .plate:after{right:.18rem}
.drawer .slot{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:.3rem;align-content:flex-start;justify-content:center;border-radius:6px;background:rgba(255,250,240,.38);padding:.3rem}
.drawer.done{background:var(--sage-l)}
.drawer:after{content:"";flex:none;align-self:center;width:3.4rem;height:.55rem;border-radius:999px;background:var(--brown);margin-top:.4rem;box-shadow:0 2px 0 rgba(255,250,240,.6)}

/* Modus 3: Spurensuche */
.t-odd .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(.5rem,1.6vw,1.2rem);width:100%}
.tcard{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid var(--brown);border-radius:10px;min-height:clamp(4.4rem,18vh,9rem);padding:.6rem .5rem .4rem;font-weight:700;font-size:clamp(1.15rem,3vmin + .4vw,2.7rem);box-shadow:0 5px 0 rgba(58,43,32,.38);color:var(--ink);word-break:break-word}
.tcard .no{position:absolute;left:.4rem;top:.15rem;font-family:var(--f-type);font-size:.75rem;color:var(--brown)}
.tcard:hover:not(:disabled){transform:translateY(-2px)}
.tcard:disabled{cursor:default}
.tcard.tried{background:#ece4d2;border-style:dashed;box-shadow:none;color:#5a4a3a}
.tcard.tried:after{content:"?";position:absolute;right:.45rem;top:.15rem;font-family:var(--f-head);color:var(--brown)}
.tcard.right{background:var(--must-l);border-color:var(--ink);box-shadow:0 0 0 5px var(--must)}
.tcard.right:before{content:"Außenseiter";position:absolute;left:50%;top:-.9rem;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--f-type);font-size:.72rem;padding:.05rem .5rem;border-radius:999px;white-space:nowrap}
.tcard.same{background:var(--paper);opacity:.85}
.odd-tools{display:flex;gap:.6rem;align-items:center}

/* Modus 4: Pinnwand */
.t-sent{gap:clamp(.5rem,2vh,1.2rem)}
.board{position:relative;width:100%;background:var(--cork);background-image:radial-gradient(rgba(107,74,51,.28) 1px,transparent 1.5px);background-size:9px 9px;border:4px solid var(--brown);border-radius:10px;padding:1.2rem 1rem .9rem;display:flex;justify-content:center}
.note{position:relative;background:#fffdf4;border:2px solid var(--line);box-shadow:0 5px 0 rgba(58,43,32,.3);padding:.9rem 1rem .8rem;max-width:100%;display:flex;gap:.8rem;align-items:center}
.note:before{content:"";position:absolute;left:50%;top:-.7rem;width:1rem;height:1rem;margin-left:-.5rem;border-radius:50%;background:var(--terra);border:2px solid var(--ink)}
.toks{display:flex;flex-wrap:wrap;gap:.2rem .35rem;justify-content:center;align-items:flex-start}
.tok{position:relative;border:2px solid transparent;border-radius:8px;background:transparent;padding:.1em .3em .15em;min-height:2.8rem;min-width:44px;font-size:clamp(1.4rem,5.2vmin + .3vw,3.4rem);font-weight:700;line-height:1.2;display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;color:var(--ink);border-bottom:3px solid var(--line)}
.tok:hover:not(:disabled){background:var(--must-l)}
.tok:disabled{cursor:default}
.tok.picked{background:var(--must);border:2px solid var(--ink);border-bottom:4px solid var(--ink)}
.tok.picked .w:after{content:" ✓";font-size:.7em}
.tok.tried{opacity:.6;border:2px dashed var(--brown);background:#ece4d2}
.tok.right{background:var(--sage-l);border:2px solid var(--sage-d);border-bottom:4px solid var(--sage-d)}
.tok .tg{display:block;font-family:var(--f-type);font-size:.38em;letter-spacing:.04em;margin-top:.1rem;color:var(--petrol);font-weight:700}
.t-sent .actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center}

/* Modus 5: Notizbuch */
.t-find .book{position:relative;display:flex;gap:clamp(.6rem,2vw,1.6rem);align-items:center;justify-content:center;width:100%;background:#fff;border:3px solid var(--brown);border-radius:6px 12px 12px 6px;padding:.8rem 1rem .8rem 2.6rem;box-shadow:0 5px 0 rgba(58,43,32,.3);background-image:repeating-linear-gradient(0deg,transparent 0 2rem,#cfe0e0 2rem calc(2rem + 2px))}

.t-find .polaroid{flex:none;width:clamp(6.5rem,24vmin,15rem);aspect-ratio:12/10;background:#fff;border:3px solid var(--brown);padding:.3rem;box-shadow:0 5px 0 rgba(58,43,32,.3);transform:rotate(-2deg);position:relative}
.t-find .polaroid:before{content:"";position:absolute;left:50%;top:-.8rem;width:3rem;height:1.2rem;margin-left:-1.5rem;background:rgba(226,172,58,.8);border:2px solid rgba(107,74,51,.5);transform:rotate(2deg)}
.t-find .bookbody{display:flex;flex-direction:column;gap:.5rem;align-items:center;min-width:0;flex:1}
.t-find .gapsent{font-size:clamp(1.25rem,3.8vmin + .3vw,2.8rem);font-weight:700;text-align:center;line-height:1.5}
.t-find .blank{display:inline-block;min-width:4.5em;border-bottom:4px solid var(--ink);margin:0 .15em;text-align:center;color:var(--sage-d);padding:0 .2em;background:linear-gradient(transparent 70%,rgba(226,172,58,.5) 70%)}
.t-find .blank.full{background:var(--sage-l);border-bottom-color:var(--sage-d);color:var(--ink)}
.t-find .answers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(.5rem,1.6vw,1.2rem);width:100%;max-width:60rem}
.t-find .abtn{min-height:clamp(3.4rem,11.5vh,6.5rem);text-transform:none;letter-spacing:.02em}

.find-row{display:flex;gap:.6rem;align-items:center;justify-content:center}

#screen-end{align-items:center;overflow:hidden}
.endwrap{flex:1;min-height:0;width:100%;max-width:62rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:.8rem}

const SORT_SIZES = {leicht:[3,4], mittel:[5,6], schwer:[6,7,8]};
const SKINS = ['sk0','sk1','sk2','sk3','sk4'];     // neutrale Papierfarben – nie an eine Wortart gebunden
const SEIN = ['ist','sind','hat','haben','war','wird','bin','bist'];
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

/* ===== Satzdaten aufbereiten ===== */
const SENTS = RAW_S.map((r,i)=>{
  const tokens = r[0].split(' ').map(t=>{ const m=t.match(/^(.+?)(?:\/([NVA]))?([.,!?]*)$/); return {w:m[1], c:m[2]||'-', p:m[3]}; });
  const counts={N:0,V:0,A:0}; tokens.forEach(t=>{ if(counts[t.c]!==undefined) counts[t.c]++; });
  const hasSein = tokens.some(t=>SEIN.includes(t.w.toLowerCase()));
  const s = {id:'s'+i, tokens, text:tokens.map(t=>t.w+t.p).join(' '), category:r[1], d:r[2], counts, hasSein};
  s.qs = [];
  CLASSES.forEach(c=>{
    if(!counts[c]) return; if(c==='V' && hasSein) return;
    const targets=[]; tokens.forEach((t,j)=>{ if(t.c===c) targets.push(j); });
    s.qs.push({cls:c, mode: counts[c]===1?'single':'all', targets});
  });
  return s;
});
const GAPS = RAW_G.map((r,i)=>({id:'g'+i, sentence:r[0], cls:r[1], answer:r[2], distractors:[r[3],r[4]], category:r[5], d:r[6], open:!!r[7]}));
function classOfDistractor(w){ if(WORD_BY_TEXT[w]) return WORD_BY_TEXT[w].wordType; if(/^[A-ZÄÖÜ]/.test(w)) return 'N'; return (/(en|ern|eln)$/.test(w) && !/^golden$/.test(w)) ? 'V' : 'A'; }

/* ===== Rundenzustand ===== */
function newRound(level){
  return { level, used:new Set(), usedGroups:new Set(), recentCats:[], catCount:{}, pos3:[0,0,0], last3:[], pos4:[0,0,0,0], last4:[],
           sentUsed:new Set(), usedText:new Set(), gapUsed:new Set(), picUsed:new Set(), picNouns:new Set(), clsCount:{N:0,V:0,A:0}, repeats:0, texts:{}, oddMajor:[], tasksMade:0 };
}
function diffBucket(level, avail){ const w=DIFF_W[level]; const ks=Object.keys(w).filter(k=>avail.includes(k)); if(!ks.length) return null;
  const tot=ks.reduce((s,k)=>s+w[k],0); let r=Math.random()*tot; for(const k of ks){ r-=w[k]; if(r<=0) return k; } return ks[ks.length-1]; }
function pickWord(R, cls, o={}){
  const ex=o.exclude||[];
  let c = WORDS.filter(w=>w.wordType===cls && !ex.some(e=>e.id===w.id || (w.group && e.group===w.group)) && (!o.filter||o.filter(w)));
  if(!c.length) return null;
  let inLv = c.filter(w=>DIFF_W[R.level][w.difficulty]); if(!inLv.length) inLv=c;
  let fresh = inLv.filter(w=>!R.used.has(w.id) && !R.usedText.has(w.word) && !(w.group&&R.usedGroups.has(w.group)));
  if(!fresh.length) fresh = inLv.filter(w=>!R.used.has(w.id) && !R.usedText.has(w.word));
  if(!fresh.length){ if(o.strict) return null; R.repeats++; fresh=inLv; }
  const b = diffBucket(R.level, [...new Set(fresh.map(w=>w.difficulty))]); if(b) fresh = fresh.filter(w=>w.difficulty===b);
  const avoid = new Set([...(o.avoidCats||[]), ...R.recentCats]);
  const better = fresh.filter(w=>!avoid.has(w.category)); if(better.length) fresh=better;
  const cc = w=>R.catCount[w.category]||0, mn=Math.min(...fresh.map(cc)); fresh=fresh.filter(w=>cc(w)===mn);
  const w = pick(fresh); take(R,w); return w;
}
function take(R,w){ R.used.add(w.id); R.usedText.add(w.word); if(w.group) R.usedGroups.add(w.group); R.catCount[w.category]=(R.catCount[w.category]||0)+1; R.recentCats.push(w.category); if(R.recentCats.length>3) R.recentCats.shift(); }
/* Position der richtigen Antwort: gleichmäßig verteilt, nie zweimal direkt hintereinander an derselben Stelle */
function pickPos(R,n){ const cnt = n===3?R.pos3:R.pos4, last = n===3?R.last3:R.last4; const mn=Math.min(...cnt);
  let c=[...Array(n).keys()].filter(i=>cnt[i]===mn); const nr=c.filter(i=>last[last.length-1]!==i); if(nr.length) c=nr; const p=pick(c); cnt[p]++; last.push(p); return p; }
function placeAt(correct, others, p){ const o=shuffle(others), r=[]; let k=0; for(let i=0;i<others.length+1;i++) r.push(i===p?correct:o[k++]); return r; }
function balancedList(n){ /* n Wortarten, möglichst gleich oft, nie mehr als zweimal hintereinander gleich */
  for(let t=0;t<200;t++){ const base=[]; let i=randInt(0,2); while(base.length<n){ base.push(CLASSES[i%3]); i++; } const l=shuffle(base);
    let ok=true; for(let j=2;j<l.length;j++) if(l[j]===l[j-1]&&l[j]===l[j-2]) ok=false; if(ok) return l; }
  return shuffle(CLASSES.concat(CLASSES,CLASSES)).slice(0,n); }

/* ===== Aufgabe 1: Welche Wortart ist das? ===== */
function makeWhich(R, cls){
  const picOk = R.level==='leicht';
  let w;
  if(picOk && Math.random()<.5){ w = pickWord(R, cls, {filter:x=>!!x.illustrationOptional, strict:true}); }
  if(!w) w = pickWord(R, cls);
  const pic = (picOk && w.illustrationOptional) ? (w.wordType==='V' ? 's_'+w.illustrationOptional : w.illustrationOptional) : null;
  const p = pickPos(R,3), skins=shuffle(SKINS).slice(0,3);
  const others = CLASSES.filter(c=>c!==cls);
  const order = placeAt(cls, others, p);
  R.clsCount[cls]++;
  return {type:'which', word:w, cls, pic, options:order.map((c,i)=>({cls:c, skin:skins[i]})), correct:p, focus:cls};
}
/* ===== Aufgabe 2: Sortiere die Beweise ===== */
function sortCounts(R,n){
  for(let t=0;t<300;t++){ const cnt={N:1,V:1,A:1}; let left=n-3; while(left>0){ const c=pick(CLASSES); cnt[c]++; left--; }
    const mx=Math.max(...CLASSES.map(c=>cnt[c])), mn=Math.min(...CLASSES.map(c=>cnt[c]));
    if(n>=6 && mn<2) continue; if(mx>4||mx-mn>2) continue; return cnt; }
  return {N:Math.ceil(n/3),V:Math.ceil((n-1)/3),A:n-Math.ceil(n/3)-Math.ceil((n-1)/3)}; }
function makeSort(R){
  const n = pick(SORT_SIZES[R.level]);
  // Wortarten mit den bisher seltensten bevorzugen
  const cnt = {N:1,V:1,A:1}; let left=n-3;
  while(left>0){ const order=shuffle(CLASSES).sort((a,b)=>(R.clsCount[a]+cnt[a])-(R.clsCount[b]+cnt[b])); const c = (n>=6||Math.random()<.7)?order[0]:order[1]; if(cnt[c]>=3 && order.some(x=>cnt[x]<3)){ left--; cnt[order[order.length-1]]++; continue; } cnt[c]++; left--; }
  const words=[]; CLASSES.forEach(c=>{ for(let i=0;i<cnt[c];i++){ const catSeen={}; words.forEach(w=>catSeen[w.category]=(catSeen[w.category]||0)+1);
    const lim=n<=4?1:2; const w=pickWord(R,c,{exclude:words, avoidCats:Object.keys(catSeen), filter:x=>(catSeen[x.category]||0)<lim}); words.push(w); R.clsCount[c]++; } });
  let order; for(let t=0;t<100;t++){ order=shuffle(words); let run=1,maxRun=1; for(let i=1;i<order.length;i++){ run = order[i].wordType===order[i-1].wordType?run+1:1; maxRun=Math.max(maxRun,run); } if(maxRun<=2 || n<=4) break; }
  return {type:'sort', words:order, n, focus:'all'};
}
/* ===== Aufgabe 3: Welches Wort gehört nicht dazu? ===== */
function makeOdd(R, major, odd){
  const maj=[]; for(let i=0;i<3;i++){ maj.push(pickWord(R,major,{exclude:maj, avoidCats:maj.map(w=>w.category)})); }
  // drei verschiedene Kategorien, damit die Gruppe nicht inhaltlich zusammenhängt
  const o = pickWord(R,odd,{exclude:maj, avoidCats:maj.map(w=>w.category)});
  R.clsCount[odd]++; R.clsCount[major]++;
  const p=pickPos(R,4); const words=placeAt(o, maj, p);
  return {type:'odd', words, odd:p, majorCls:major, oddCls:odd, focus:odd};
}
/* ===== Aufgabe 4: Wortarten im Satz ===== */
function makeSentence(R, cls, wantMode){
  const lv = R.level, dmap={leicht:['e'],mittel:['m','e'],schwer:['h','m']}[lv];
  let cands=[];
  SENTS.forEach(s=>{ if(!dmap.includes(s.d)) return; s.qs.forEach(q=>{ if(q.cls!==cls) return; if(lv==='leicht' && q.mode!=='single') return; if(lv==='schwer' && s.d!=='h' ) return; cands.push({s,q}); }); });
  if(!cands.length){ SENTS.forEach(s=>s.qs.forEach(q=>{ if(q.cls===cls) cands.push({s,q}); })); }
  let fresh=cands.filter(c=>!R.sentUsed.has(c.s.id)); if(!fresh.length) fresh=cands;
  if(wantMode){ const m=fresh.filter(c=>c.q.mode===wantMode); if(m.length) fresh=m; }
  const c=pick(fresh); R.sentUsed.add(c.s.id); R.clsCount[cls]++;
  return {type:'sent', sent:c.s, q:c.q, focus:cls};
}
/* ===== Aufgabe 5: Finde das passende Wort! ===== */
function makeFind(R, cls, variant){
  const lv=R.level;
  const kinds = [];
  if(lv==='leicht'){ if(cls==='N') kinds.push('picN','gap'); if(cls==='V') kinds.push('picV','gap'); if(cls==='A') kinds.push('picA','gap'); }
  else if(lv==='mittel'){ if(cls==='N') kinds.push('gap'); if(cls==='V') kinds.push('picV','gap'); if(cls==='A') kinds.push('picA','gap'); }
  else { kinds.push('gap'); }
  let kind = variant || pick(kinds);
  if(kind==='picN'){
    const w=pickWord(R,'N',{filter:x=>!!x.illustrationOptional});
    const v=pickWord(R,'V',{exclude:[w]}), a=pickWord(R,'A',{exclude:[w]});
    return finishFind({kind, cls:'N', pic:w.illustrationOptional, answer:w, others:[v,a], prompt:'Gesucht wird ein NOMEN, das zum Bild passt.'}, R);
  }
  if(kind==='picV'){
    let sc = VERB_SCENES.filter(s=>(lv==='leicht'?s.d==='e':true) && !R.picUsed.has(s.pic) && !R.used.has(WORD_BY_TEXT[s.verb].id) && !R.usedText.has(s.verb)); if(!sc.length) sc=VERB_SCENES.filter(s=>!R.picUsed.has(s.pic)); if(!sc.length) sc=VERB_SCENES;
    const s=pick(sc); R.picUsed.add(s.pic);
    const vw = WORD_BY_TEXT[s.verb]; take(R,vw);
    const n=pickWord(R,'N',{filter:x=>!s.nouns.includes(x.word)}), a=pickWord(R,'A',{filter:x=>!s.noAdj.includes(x.word)});
    return finishFind({kind, cls:'V', pic:s.pic, answer:vw, others:[n,a], prompt:'Gesucht wird ein VERB, das zum Bild passt.'}, R);
  }
  if(kind==='picA'){
    const nUsed=s=>{ const nw=WORD_BY_TEXT[s.noun]; return (nw && R.used.has(nw.id)) || R.picNouns.has(s.noun) || R.usedText.has(s.noun); };
    let ap = ADJ_PICS.filter(s=>(lv==='leicht'?s.d==='e':true) && !R.picUsed.has(s.pic) && !R.used.has(WORD_BY_TEXT[s.adj].id) && !R.usedText.has(s.adj) && !nUsed(s)); if(!ap.length) ap=ADJ_PICS.filter(s=>!R.picUsed.has(s.pic)); if(!ap.length) ap=ADJ_PICS;
    const s=pick(ap); R.picUsed.add(s.pic); R.picNouns.add(s.noun); R.usedText.add(s.noun); if(WORD_BY_TEXT[s.noun]) take(R,WORD_BY_TEXT[s.noun]);
    const aw = WORD_BY_TEXT[s.adj]; take(R,aw);
    const v=pickWord(R,'V',{filter:x=>!(x.word==='fahren'&&s.noun==='Fahrrad')});
    const nounObj = {word:s.noun, wordType:'N', id:'pn_'+s.noun, category:'alltag', difficulty:'e'};
    return finishFind({kind, cls:'A', pic:s.pic, answer:aw, others:[nounObj,v], prompt:'Gesucht wird ein ADJEKTIV, das zum Bild passt.'}, R);
  }
  // Lückensatz
  const dm = {leicht:['e'],mittel:['m'],schwer:['h']}[lv];
  let g = GAPS.filter(x=>x.cls===cls && dm.includes(x.d) && !R.gapUsed.has(x.id));
  if(variant==='gapOpen') g=g.filter(x=>x.open); 
  if(!g.length) g = GAPS.filter(x=>x.cls===cls && dm.includes(x.d));
  if(lv==='schwer'){ const op=g.filter(x=>x.open), cl=g.filter(x=>!x.open); const useOpen = op.length && (!cl.length || Math.random()<.5); g = useOpen?op:cl; }
  const fr=g.filter(y=>![y.answer,...y.distractors].some(t=>R.usedText.has(t))); if(fr.length) g=fr;
  const x=pick(g); R.gapUsed.add(x.id); R.clsCount[cls]++; [x.answer,...x.distractors].forEach(t=>R.usedText.add(t));
  const answer={word:x.answer, wordType:cls, id:'g_'+x.id};
  const others=x.distractors.map(w=>({word:w, wordType:classOfDistractor(w), id:'gd_'+w}));
  const p=pickPos(R,3), skins=shuffle(SKINS).slice(0,3), order=placeAt(answer, others, p);
  return {type:'find', kind:'gap', cls, open:x.open, sentence:x.sentence, gapId:x.id, options:order.map((o,i)=>({word:o.word,cls:o.wordType,skin:skins[i]})), correct:p, focus:cls,
          prompt: x.open ? 'Welches Wort passt in die Lücke?' : 'Gesucht wird '+(cls==='A'?'ein ADJEKTIV':cls==='V'?'ein VERB':'ein NOMEN')+'.'};
}
function finishFind(t, R){
  R.clsCount[t.cls]++;
  const p=pickPos(R,3), skins=shuffle(SKINS).slice(0,3);
  const order=placeAt(t.answer, t.others, p);
  return {type:'find', kind:t.kind, cls:t.cls, pic:t.pic, prompt:t.prompt, options:order.map((o,i)=>({word:o.word,cls:o.wordType,skin:skins[i]})), correct:p, focus:t.cls, answerWord:t.answer.word};
}

/* ===== Rundenplan ===== */
const MODES = [
 {id:1, key:'which', icon:'lupe', place:'Die Lupe', title:'Welche Wortart ist das?', fall:'Der erste Fall'},
 {id:2, key:'sort', icon:'schrank', place:'Der Aktenschrank', title:'Sortiere die Beweise!', fall:'Fall Nr. 2'},
 {id:3, key:'odd', icon:'spur', place:'Die Spurensuche', title:'Welches Wort gehört nicht dazu?', fall:'Fall Nr. 3'},
 {id:4, key:'sent', icon:'pinnwand', place:'Die Pinnwand', title:'Wortarten im Satz', fall:'Fall Nr. 4'},
 {id:5, key:'find', icon:'notizbuch', place:'Das Notizbuch', title:'Finde das passende Wort!', fall:'Fall Nr. 5'},
 {id:6, key:'mix', icon:'fallakte', place:'Detektivzentrale', title:'Der große Wörterfall', fall:'Der große Fall'}
];
const MODE_BY_ID = {}; MODES.forEach(m=>MODE_BY_ID[m.id]=m);
function oddPairs(){ /* 8 Paare (Mehrheit, Ausreißer): alle 6 möglichen Kombinationen + 2 weitere, gemischt */
  const all=[]; CLASSES.forEach(a=>CLASSES.forEach(b=>{ if(a!==b) all.push([a,b]); }));
  for(let t=0;t<200;t++){ const extra=shuffle(all).slice(0,2); const l=shuffle(all.concat(extra)); let ok=true; for(let i=1;i<l.length;i++) if(l[i][0]===l[i-1][0]&&l[i][1]===l[i-1][1]) ok=false; if(ok) return l; }
  return shuffle(all.concat(all.slice(0,2))); }
function mixTypes(){ /* 8 Aufgabenarten: jede der fünf mindestens einmal, nie zweimal direkt dieselbe */
  const base=['which','sort','odd','sent','find'];
  for(let t=0;t<500;t++){ const extra=[]; while(extra.length<3) extra.push(pick(base)); const l=shuffle(base.concat(extra)); let ok=true; for(let i=1;i<l.length;i++) if(l[i]===l[i-1]) ok=false;
    // je Art höchstens zweimal
    const cnt={}; l.forEach(x=>cnt[x]=(cnt[x]||0)+1); if(Object.values(cnt).some(v=>v>2)) ok=false; if(ok) return l; }
  return base.concat(['which','sent','find']); }
function makeRound(modeId, level){
  const R=newRound(level), tasks=[];
  const key=MODE_BY_ID[modeId].key;
  if(key==='which'){ balancedList(ROUND_TARGET).forEach(c=>tasks.push(makeWhich(R,c))); }
  else if(key==='sort'){ for(let i=0;i<ROUND_TARGET;i++) tasks.push(makeSort(R)); }
  else if(key==='odd'){ oddPairs().forEach(([a,b])=>tasks.push(makeOdd(R,a,b))); }
  else if(key==='sent'){ const cl=balancedList(ROUND_TARGET); const modes = level==='leicht' ? cl.map(()=>'single') : shuffle(level==='mittel'?['single','single','single','single','all','all','all','single']:['all','all','all','all','all','single','single','all']);
    cl.forEach((c,i)=>tasks.push(makeSentence(R,c,modes[i]))); }
  else if(key==='find'){ balancedList(ROUND_TARGET).forEach(c=>tasks.push(makeFind(R,c))); }
  else { const types=mixTypes(); const cl=balancedList(types.filter(t=>t!=='sort').length); let ci=0, oddP=oddPairs();
    types.forEach(t=>{ if(t==='sort') tasks.push(makeSort(R)); else if(t==='odd'){ const [a,b]=oddP.shift(); tasks.push(makeOdd(R,a,b)); ci++; }
      else { const c=cl[ci++]; if(t==='which') tasks.push(makeWhich(R,c)); else if(t==='sent') tasks.push(makeSentence(R,c)); else tasks.push(makeFind(R,c)); } }); }
  tasks.forEach((t,i)=>{ t.idx=i; });
  return {R, tasks, mode:modeId, level};
}

/* ===== Prüfung einer Aufgabe (wird im Spiel unter #qa und in der Simulation genutzt) ===== */
function validateTask(t, level){
  const errs=[]; const E=m=>errs.push(m);
  const lvOK = w => !!DIFF_W[level][w.difficulty] || w.id.startsWith('pn_') || w.id.startsWith('g_') || w.id.startsWith('gd_');
  if(t.type==='which'){
    if(t.options.length!==3 || new Set(t.options.map(o=>o.cls)).size!==3) E('which: Optionen nicht 3 verschiedene Wortarten');
    if(t.options[t.correct].cls!==t.word.wordType || t.cls!==t.word.wordType) E('which: richtige Option passt nicht zum Wort');
    if(t.options.filter(o=>o.cls===t.word.wordType).length!==1) E('which: nicht genau eine richtige Option');
    if(new Set(t.options.map(o=>o.skin)).size!==3) E('which: Farben doppelt');
    if(!lvOK(t.word)) E('which: Wort nicht in Stufe');
  } else if(t.type==='sort'){
    if(!SORT_SIZES[level].includes(t.words.length)) E('sort: falsche Anzahl '+t.words.length);
    if(new Set(t.words.map(w=>w.id)).size!==t.words.length) E('sort: Wort doppelt');
    CLASSES.forEach(c=>{ if(!t.words.some(w=>w.wordType===c)) E('sort: Wortart fehlt '+c); });
    const cc={}; t.words.forEach(w=>cc[w.category]=(cc[w.category]||0)+1); if(Object.values(cc).some(v=>v>(t.words.length<=4?1:2))) E('sort: zu viele aus einer Kategorie');
    const gg=t.words.filter(w=>w.group).map(w=>w.group); if(new Set(gg).size!==gg.length) E('sort: gleicher Wortstamm');
    t.words.forEach(w=>{ if(!lvOK(w)) E('sort: Wort nicht in Stufe '+w.word); });
  } else if(t.type==='odd'){
    if(t.words.length!==4) E('odd: nicht 4 Wörter');
    const odd=t.words[t.odd]; const rest=t.words.filter((w,i)=>i!==t.odd);
    if(!rest.every(w=>w.wordType===t.majorCls)) E('odd: Mehrheit nicht einheitlich');
    if(odd.wordType===t.majorCls) E('odd: Ausreißer hat gleiche Wortart');
    if(t.words.filter(w=>w.wordType!==t.majorCls).length!==1) E('odd: nicht genau ein Ausreißer');
    if(new Set(rest.map(w=>w.category)).size!==3) E('odd: Mehrheit aus gleicher Kategorie');
    if(new Set(t.words.map(w=>w.id)).size!==4) E('odd: Wort doppelt');
    const gg=t.words.filter(w=>w.group).map(w=>w.group); if(new Set(gg).size!==gg.length) E('odd: gleicher Wortstamm');
    t.words.forEach(w=>{ if(!lvOK(w)) E('odd: Wort nicht in Stufe '+w.word); });
  } else if(t.type==='sent'){
    const toks=t.sent.tokens; const real=[]; toks.forEach((x,j)=>{ if(x.c===t.q.cls) real.push(j); });
    if(JSON.stringify(real)!==JSON.stringify(t.q.targets)) E('sent: Ziele passen nicht zu den Markierungen');
    if(t.q.mode==='single' && real.length!==1) E('sent: single, aber '+real.length+' Lösungen');
    if(t.q.mode==='all' && real.length<2) E('sent: all, aber '+real.length+' Lösungen');
    if(t.q.cls==='V' && t.sent.hasSein) E('sent: Verb-Frage bei Satz mit sein/haben');
    if(level==='leicht' && t.q.mode!=='single') E('sent: leicht ohne eindeutige Lösung');
    if(level==='leicht' && toks.length>6) E('sent: leicht zu lang');
    if(level==='schwer' && toks.length<7) E('sent: schwer zu kurz');
  } else if(t.type==='find'){
    if(t.options.length!==3 || new Set(t.options.map(o=>o.cls)).size!==3) E('find: Optionen nicht 3 verschiedene Wortarten');
    if(t.options[t.correct].cls!==t.cls) E('find: richtige Option hat falsche Wortart');
    if(t.options.filter(o=>o.cls===t.cls).length!==1) E('find: nicht genau eine passende Option');
    if(t.kind==='gap'){ const g=GAPS.find(x=>x.id===t.gapId); if(!g || t.options[t.correct].word!==g.answer) E('find: Lücke – falsche Lösung'); }
    if(t.kind==='picV'){ const s=VERB_SCENES.find(x=>x.pic===t.pic); if(!s || t.options[t.correct].word!==s.verb) E('find: Verb passt nicht zum Bild'); if(s && t.options.some(o=>o.cls==='N' && s.nouns.includes(o.word))) E('find: Ablenker im Bild sichtbar'); if(s && t.options.some(o=>o.cls==='A' && s.noAdj.includes(o.word))) E('find: Adjektiv-Ablenker passt zum Bild'); }

  const list=[ `${q} beschreibt, wie ${who} ist.`, `Wie ist ${who}? ${W}! Das ist ein Adjektiv.`, `${q} ist ein Adjektiv. Es sagt, wie ${who} sein kann.` ];

   V:[ w.sub==='vorgang' ? `Passiert das manchmal? Sagt ${q}, was geschieht?` : `Kann jemand ${q}? Ist es etwas, das man tut?`,

  function place(c, d){
    if(state.locked||!c||c.classList.contains('in')) return;
    const w=WORD_BY_ID[c.dataset.id];
    if(w.wordType===d.dataset.cls){
      const chip=el('span','wc in',w.word); d.querySelector('.slot').appendChild(chip);
      c.remove(); sel=null; remaining--;
      if(remaining===0){
        document.querySelectorAll('.drawer').forEach(x=>x.classList.add('done')); tray.style.minHeight='0';
        const parts=CLASSES.map(k=>{ const ws=t.words.filter(x=>x.wordType===k).map(x=>x.word); return ws.length?`${CLS_PL[k]}: ${ws.join(', ')}`:''; }).filter(Boolean);
        solved('Alle Beweise liegen im richtigen Fach!', parts.join(' · '), 'Alles richtig sortiert!');
      } else { setFb('ok','Passt!',explainWord(state.plan.R,w)); say(w.word); }
    } else {
      c.classList.remove('sel'); c.setAttribute('aria-pressed','false'); sel=null;
      state.attempts[w.id]=(state.attempts[w.id]||0)+1; state.wrong++;
      setFb('hint',`„${w.word}“ passt hier noch nicht.`, hintSort(w, state.attempts[w.id]-1));
    }
  }
  t.words.forEach(w=>{
    const c=el('button','wc',w.word); c.type='button'; c.dataset.id=w.id; c.dataset.word=w.word; c.setAttribute('aria-pressed','false');
    c.addEventListener('click',()=>{ if(c._dragged){ c._dragged=false; return; } if(state.locked) return; select(c); });
    attachDrag(c, d=>place(c,d), ()=>{ if(sel!==c) select(c); }, ()=>state.locked||c.classList.contains('in'), '.drawer');
    tray.appendChild(c);
  });
  CLASSES.forEach(k=>{
    const d=el('div','drawer'); d.dataset.cls=k; d.setAttribute('role','group'); d.setAttribute('aria-label','Fach '+CLS_UP_PL[k]);
    const pl=el('button','plate',CLS_UP_PL[k]); pl.type='button'; pl.setAttribute('aria-label','Ausgewähltes Wort in das Fach '+CLS_UP_PL[k]+' legen');
    d.appendChild(pl); d.appendChild(el('div','slot'));
    d.addEventListener('click',()=>{ if(state.locked) return; if(!sel){ setFb('info','Wähle zuerst ein Wort.','Tippe ein Wort an und dann das passende Fach – oder zieh das Wort hinein.'); return; } place(sel,d); });
    dEls[k]=d; drawers.appendChild(d);
  });
  root.appendChild(tray); root.appendChild(drawers);
  const sp=speakBtn(()=>t.words.map(w=>w.word),'Alle Wörter vorlesen'); spkRow.appendChild(sp); tray.appendChild(sp);
  st.appendChild(root);
};
/* Ziehen mit Maus/Finger (Zeiger-Ereignisse). Tippen-Alternative läuft über click. */
function attachDrag(card, onDrop, onStart, isBlocked, targetSel){
  let start=null, ghost=null, moved=false, over=null;
  card.addEventListener('pointerdown',e=>{
    if(isBlocked()) return; if(e.pointerType==='mouse' && e.button!==0) return;
    start={x:e.clientX,y:e.clientY,id:e.pointerId}; moved=false; card._dragged=false;
    try{ card.setPointerCapture(e.pointerId); }catch(_){}
  });
  card.addEventListener('pointermove',e=>{
    if(!start||e.pointerId!==start.id) return;
    const dx=e.clientX-start.x, dy=e.clientY-start.y;
    if(!moved && Math.hypot(dx,dy)>8){
      moved=true; ghost=card.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); ghost.style.width=card.offsetWidth+'px'; document.body.appendChild(ghost); card.classList.add('drag-src'); onStart();
    }
    if(moved){
      ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px'; ghost.style.top=(e.clientY-ghost.offsetHeight/2)+'px';
      const under=document.elementFromPoint(e.clientX,e.clientY), tg=under&&under.closest?under.closest(targetSel):null;
      if(over&&over!==tg) over.classList.remove('over'); over=tg; if(tg) tg.classList.add('over');
    }
  });
  const end=e=>{
    if(!start||e.pointerId!==start.id) return;
    const wasMoved=moved; start=null; moved=false;
    if(ghost){ ghost.remove(); ghost=null; } card.classList.remove('drag-src'); if(over){ over.classList.remove('over'); over=null; }
    if(wasMoved){
      card._dragged=true; setTimeout(()=>{ card._dragged=false; },60);
      if(e.type==='pointerup'){ const under=document.elementFromPoint(e.clientX,e.clientY), tg=under&&under.closest?under.closest(targetSel):null; if(tg) onDrop(tg); else { card.classList.remove('sel'); card.setAttribute('aria-pressed','false'); } }
    }
  };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}

/* ================= Modus 3: Welches Wort gehört nicht dazu? ================= */
RENDER.odd = function(t, st){
  const root=el('div','task t-odd');
  root.appendChild(el('p','prompt','Welches Wort gehört nicht dazu?'));
  const cards=el('div','cards'); const skins=shuffle(SKINS); const btns=[];
  t.words.forEach((w,i)=>{
    const b=el('button','tcard '+skins[i%5],`<span class="no" aria-hidden="true">Spur ${i+1}</span>${w.word}`); b.type='button'; btns.push(b);
    b.addEventListener('click',()=>{
      if(state.locked||b.disabled) return;
      if(i===t.odd){
        btns.forEach((x,j)=>{ x.disabled=true; if(j!==i) x.classList.add('same'); }); b.classList.add('right');
        const rest=t.words.filter((x,j)=>j!==i).map(x=>x.word);
        solved(`${w.word} → ${CLS_UP[t.oddCls]}`, `${rest.join(' • ')} → ${CLS_UP_PL[t.majorCls]}`, `${w.word} gehört nicht dazu. ${w.word} ist ${ {N:'ein Nomen',V:'ein Verb',A:'ein Adjektiv'}[t.oddCls] }.`);
      } else { b.disabled=true; b.classList.add('tried'); wrong(hintOdd(t,w,state.wrong)); }
    });
    cards.appendChild(b);
  });
  root.appendChild(cards);
  const row=el('div','odd-tools'); row.appendChild(speakBtn(()=>t.words.map(w=>w.word),'Alle Wörter vorlesen')); root.appendChild(row);
  st.appendChild(root);
};

/* ================= Modus 4: Wortarten im Satz ================= */
RENDER.sent = function(t, st){
  const root=el('div','task t-sent'); const q=t.q, S=t.sent;
  const name=CLS_NAME[q.cls], pl=CLS_PL[q.cls];
  const art = q.mode==='single' ? (q.cls==='N'?'das':'das') : 'alle';
  root.appendChild(el('p','prompt', q.mode==='single' ? `Finde das <span class="tag">${name}</span>.` : `Finde alle <span class="tag">${pl}</span>.`));
  const board=el('div','board'), note=el('div','note'); const toks=el('div','toks'); const els=[];
  S.tokens.forEach((tk,j)=>{
    const b=el('button','tok',`<span class="w">${tk.w}${tk.p}</span><span class="tg" aria-hidden="true" style="visibility:hidden">Adjektiv</span>`); b.type='button'; b.dataset.j=j; els.push(b);
    b.setAttribute('aria-label',tk.w+(q.mode==='all'?'':'')); b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{
      if(state.locked||b.disabled) return;
      if(q.mode==='single'){
        if(q.targets.includes(j)){ finish(); }
        else { b.disabled=true; b.classList.add('tried'); const n=state.wrong; wrong(hintSent(tk,q.cls,n)); }
      } else {
        const on=!b.classList.contains('picked'); b.classList.toggle('picked',on); b.setAttribute('aria-pressed',String(on));
      }
    });
    toks.appendChild(b);
  });
  function reveal(){
    els.forEach((b,j)=>{ const tk=S.tokens[j]; b.disabled=true; const tg=b.querySelector('.tg');
      if(tk.c!=='-'){ tg.textContent=CLS_NAME[tk.c]; tg.style.visibility='visible'; }
      if(q.targets.includes(j)){ b.classList.remove('picked','tried'); b.classList.add('right'); } });
  }
  function finish(){
    reveal();
    const words=q.targets.map(j=>S.tokens[j].w);
    const head = q.mode==='single' ? `${words[0]} → ${CLS_UP[q.cls]}` : `${words.join(', ')} → ${CLS_UP_PL[q.cls]}`;
    solved(head, explainSent(state.plan.R,q.cls), S.text);
  }
  note.appendChild(toks); note.appendChild(speakBtn(()=>S.text,'Satz vorlesen')); board.appendChild(note); root.appendChild(board);
  if(q.mode==='all'){
    const act=el('div','actions'); const ok=el('button','btn pri','Fertig'); ok.type='button';
    ok.addEventListener('click',()=>{ if(state.locked) return;
      const sel=els.map((b,j)=>b.classList.contains('picked')?j:-1).filter(j=>j>=0);
      if(sel.length===q.targets.length && sel.every(j=>q.targets.includes(j))) finish();
      else { state.wrong++; setFb('hint','Noch nicht ganz.', hintSentAll(sel,q.targets,S.tokens,q.cls)); } });
    const hintSp=el('span','',`Tippe jedes passende Wort an. Dann „Fertig“.`); act.appendChild(hintSp); act.appendChild(ok);
    if(window.matchMedia && window.matchMedia('(max-height:520px)').matches){ hintSp.hidden=true; act.classList.add('inline'); note.appendChild(act); } else root.appendChild(act);
  }
  st.appendChild(root);
};

/* ================= Modus 5: Finde das passende Wort! ================= */
RENDER.find = function(t, st){
  const root=el('div','task t-find');
  const tagged = t.prompt.replace(/(NOMEN|VERB|ADJEKTIV)/,'<span class="tag">$1</span>');
  root.appendChild(el('p','prompt',tagged));
  const book=el('div','book'); let blank=null, picword=null;
  if(t.kind==='gap'){
    const parts=t.sentence.split('___'); const sp=el('p','gapsent'); sp.appendChild(document.createTextNode(parts[0]));
    blank=el('span','blank','&nbsp;'); blank.setAttribute('aria-label','Lücke'); sp.appendChild(blank); sp.appendChild(document.createTextNode(parts[1]||''));
    const body=el('div','bookbody'); body.appendChild(sp); book.appendChild(body);
    book.appendChild(speakBtn(()=>[t.sentence.replace('___','Lücke')].concat(t.options.map(o=>o.word)),'Satz und Wörter vorlesen'));
  } else {
    const pol=el('div','polaroid'); pol.innerHTML=artSvg(t.pic); book.appendChild(pol);
    picword=el('div','picword','&nbsp;'); const body=el('div','bookbody'); body.appendChild(picword); book.appendChild(body);
    book.appendChild(speakBtn(()=>t.options.map(o=>o.word),'Wörter vorlesen'));
  }
  root.appendChild(book);
  const ans=el('div','answers'); const btns=[];
  t.options.forEach((o,i)=>{
    const b=el('button','abtn '+o.skin,o.word); b.type='button'; btns.push(b);
    b.addEventListener('click',()=>{
      if(state.locked||b.disabled) return;
      if(i===t.correct){
        btns.forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add('dim'); }); b.classList.add('right');
        const w=o.word;
        if(t.kind==='gap'){
          blank.textContent=w; blank.classList.add('full');
          const full=t.sentence.replace('___',w);
          solved(full, `„${w}“ ist ${ {N:'ein Nomen',V:'ein Verb',A:'ein Adjektiv'}[t.cls] } und passt in die Lücke.`, full);
        } else {
          picword.textContent=w;
          solved(`${w} → ${CLS_UP[t.cls]}`, explainFindPic(t,w), `${w}. ${CLS_NAME[t.cls]}.`);
        }
      } else { b.disabled=true; b.classList.add('tried'); wrong(hintFind(t,o,state.wrong)); }
    });
    ans.appendChild(b);
  });
  root.appendChild(ans); st.appendChild(root);
};
function explainFindPic(t,w){
  if(t.kind==='picN') return 'Das passt zum Bild. Nomen schreibt man groß.';
  if(t.kind==='picV') return 'Das passt zum Bild: Ein Verb sagt, was jemand tut.';
  return 'Das passt zum Bild: Ein Adjektiv sagt, wie etwas ist.';
}
